<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Dino</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #f7f7f7; }
      canvas { display: block; }
      #menu, #loading {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 26px;
        font: 400 14px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #4a4636; background: #dfe6e2;
      }
      #menu[hidden], #loading[hidden] { display: none; }
      #menu-inner { display: flex; flex-direction: column; align-items: flex-start; gap: 22px; }
      #menu-title, #loading p { letter-spacing: .34em; text-transform: uppercase; opacity: .5; margin: 0; }
      #menu-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
      #menu-list button {
        appearance: none; background: none; border: 0; cursor: pointer;
        font: 600 30px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #4a4636; letter-spacing: .04em; padding: 4px 0; display: flex;
        align-items: baseline; gap: 16px; transition: color .12s, opacity .12s;
        opacity: .55;
      }
      #menu-list button:hover, #menu-list button:focus-visible { opacity: 1; color: #2f6b4a; outline: none; }
      #menu-list .index { font-size: 13px; opacity: .5; }
      #menu-list .hint { font-size: 12px; letter-spacing: .1em; opacity: .55; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="menu" hidden>
      <div id="menu-inner">
        <p id="menu-title">choose your world</p>
        <ul id="menu-list"></ul>
      </div>
    </div>
    <div id="loading"><p>loading</p></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
